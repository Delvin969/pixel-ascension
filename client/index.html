<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Ascension</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #151827; color: #f3f4f6; font-family: system-ui, sans-serif; }
    main { text-align: center; padding: 2rem; }
    canvas { width: min(90vw, 640px); height: auto; border: 3px solid #6c72a0; background: #222944; image-rendering: pixelated; }
  </style>
</head>
<body>
  <main>
    <h1>Pixel Ascension</h1>
    <p>Gunakan tombol panah atau WASD untuk menggerakkan karakter.</p>
    <canvas id="game" width="320" height="180" aria-label="Area permainan Pixel Ascension"></canvas>
  </main>
  <script src="game.js"></script>
</body>
</html>
